<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Padel Power: juega niveles, gana misiones y activa poderes unicos.">
<title>Padel Power</title>
<link rel="stylesheet" href="style.css">

<body>
<header class="barra">
  <div class="marca">
    <h1 class="titulo">PADEL<span>POWER</span></h1>
    <p class="subtitulo">Niveles &middot; Misiones &middot; Poderes</p>
  </div>
  <div class="ayuda">
    <span><kbd>A</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&rarr;</kbd> lateral</span>
    <span><kbd>W</kbd><kbd>S</kbd> / <kbd>&uarr;</kbd><kbd>&darr;</kbd> fondo</span>
    <span><kbd>E</kbd> poder</span>
    <span><kbd>Enter</kbd> confirmar</span>
    <span><kbd>Esc</kbd> menú</span>
  </div>
</header>

<main class="juego">
  <div class="marco">
    <canvas id="game" width="1280" height="800">
      Tu navegador no soporta Canvas. Usá un navegador moderno (Chrome, Edge o Firefox).
    </canvas>
  </div>
</main>
